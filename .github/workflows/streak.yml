name: Update profile cards

on:
  schedule:
    - cron: "30 17 * * *" # 00:30 WIB setiap hari
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/streak.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # pinned to a commit so a moved tag cannot swap in different code (v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate streak.svg
        run: python3 .github/scripts/streak.py ${{ github.repository_owner }}

      - name: Update GitHub Stats in terminal card
        env:
          USER_NAME: ${{ github.repository_owner }}
          # Optional read-only personal access token; lets private repos count in the totals
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stats.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- streak.svg dark_mode.svg light_mode.svg)" ]; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add streak.svg dark_mode.svg light_mode.svg
          git commit -m "Update profile cards"
          git push
